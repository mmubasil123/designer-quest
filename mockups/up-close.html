<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Up close · MoMu</title>
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="scenes.css"><!-- H7: the study piece stands in a room from its own time --><!-- B9 MoMu theme: tokens and fonts -->
<style>
/* colour, type and motion tokens come from theme.css */
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: var(--t-body); display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto; -webkit-font-smoothing: antialiased; }
button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }
.mono { font: var(--t-label); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.press { transition: transform 160ms var(--ease-out); }
.press:active { transform: scale(0.97); }

/* H6: the same header as the Stage (spacing, logo, a round 44 px pill for the one action), so the two pages read as one app */
header { display: flex; align-items: center; gap: 10px; padding: max(18px, env(safe-area-inset-top)) 16px 6px; }
.back { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
  background: var(--paper); box-shadow: var(--shadow-pill); color: var(--ink); text-decoration: none; }
.brand { font: 500 15px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
header .mono { margin-left: auto; }

#view { position: relative; isolation: isolate; background: var(--wall); margin: 0 16px; border-radius: var(--r-pic); overflow: hidden; touch-action: none; }
#view canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 400ms var(--ease-out); }
#view.ready canvas { opacity: 1; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
#view.ready #loading { display: none; }
/* H10: the MoMu logo breathes while the scan loads (the only sign of progress); still under reduced motion */
#loading .load-logo { width: 86px; height: 48px; margin: 0 auto 6px; animation: logo-breathe 1.4s ease-in-out infinite alternate; }
@keyframes logo-breathe { from { opacity: 1; } to { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { #loading .load-logo { animation: none; } }
/* H11: a found detail keeps a plain mark on the piece (no order number, J5) */
.pin { position: absolute; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
  border: 2px solid var(--paper); background: var(--found); pointer-events: none; transition: opacity 200ms var(--ease-out);
  box-shadow: 0 1px 6px rgb(0 0 0 / .3); }
.pin[hidden] { display: block; opacity: 0; }
/* H11: a hint marks an area, never the exact spot: the visitor still finds it and taps it */
.ring { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  border: 2px dashed var(--paper); background: rgb(255 255 255 / .14); box-shadow: 0 0 0 1px rgb(0 0 0 / .35), 0 2px 10px rgb(0 0 0 / .2);
  pointer-events: none; transition: opacity 200ms var(--ease-out); }
.ring[hidden] { display: block; opacity: 0; }
.ring > i { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--paper); animation: breathe 1.6s var(--ease-out) infinite; }
@keyframes breathe { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.15); opacity: 0; } }
.miss { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
  border: 1.5px solid var(--ink); pointer-events: none; animation: miss 500ms var(--ease-out) forwards; }
@keyframes miss { from { transform: scale(.6); opacity: .6; } to { transform: scale(1.1); opacity: 0; } }
#toast { position: absolute; z-index: 3; left: 50%; bottom: 16px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap;
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#view.moment-on #toast { opacity: 0; }
/* H11 + J5: the found moment, the record's own words large, then a nudge to the real piece in the room */
#moment { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--paper); border-radius: var(--r-card);
  box-shadow: var(--shadow-card); padding: 16px 16px 8px; display: grid; z-index: 2; gap: 8px; max-height: calc(100% - 24px); overflow: auto;
  opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity 150ms ease, transform 150ms ease; }
#view.moment-on #moment { opacity: 1; transform: none; pointer-events: auto;
  transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out); }
#moment .mono { color: var(--found); }
#moment q { display: block; font: italic 400 22px/1.3 var(--serif); quotes: "“" "”"; text-wrap: pretty; }
#moment .en { color: var(--muted); font: var(--t-small); }
#moment .room { font-weight: 500; padding-top: 4px; }
#moment .acts { display: flex; justify-content: flex-end; gap: 8px; }
#moment button { min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 500; }
#moment button.go { background: var(--ink); color: var(--paper); }

aside { padding: 20px 16px max(16px, env(safe-area-inset-bottom)); display: grid; gap: 16px; }
h1 { font: var(--t-display); letter-spacing: var(--track-title); text-wrap: balance; text-transform: uppercase; color: var(--title-ink); }
.meta { display: flex; gap: 10px; margin-top: 8px; }
.progress { display: flex; align-items: center; justify-content: space-between; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background-color 200ms ease; }
.dots i.on { background: var(--found); }
ol { list-style: none; padding: 0; display: grid; border-top: 1px solid var(--ink); }
li { border-bottom: 1px solid var(--line); }
.how { color: var(--muted); font: var(--t-small); margin-bottom: -6px; }
.row { width: 100%; min-height: 52px; display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 8px 0; }
/* H11: an unfound clue is an open ring, a found one fills in; no order numbers (J5) */
.mark { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted);
  transition: background-color 200ms ease, border-color 200ms ease; }
li.found .mark { background: var(--found); border-color: var(--found); }
.find { font-weight: 500; }
/* H11: "Hint" stays out of the way until the visitor has tried (a miss) or looked for a while */
.show { font-size: 13px; padding: 10px 0 10px 12px; min-height: 44px; text-decoration: underline; text-decoration-color: var(--accent);
  text-decoration-thickness: 1.5px; text-underline-offset: 4px; opacity: 0; visibility: hidden;
  transition: opacity 200ms var(--ease-out), visibility 0s 200ms, transform 160ms var(--ease-out); }
aside.hints .show { opacity: 1; visibility: visible; transition: opacity 200ms var(--ease-out), visibility 0s, transform 160ms var(--ease-out); }
li.found .show { display: none; }
.fact { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 250ms var(--ease-out); }
li.found .fact { grid-template-rows: 1fr; }
.fact > div { overflow: hidden; padding-left: 24px; }
.fact q { display: block; font: var(--t-quote); quotes: "“" "”"; }
.fact p { color: var(--muted); font-size: 13px; margin: 6px 0 14px; }
.fact .mono { font-size: 10px; margin-right: 6px; }
.cta { min-height: 52px; border-radius: 999px; font-weight: 500; font-size: 15px; background: transparent; color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--ink); transition: background-color 200ms ease, color 200ms ease, transform 160ms var(--ease-out); }
.cta.on { background: var(--ink); color: var(--paper); }
.more { justify-self: start; min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.more[hidden] { display: none; }
.credit { font-size: 12px; color: var(--muted); }

@media (min-width: 860px) {
  body { grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr); }
  header { grid-column: 1 / -1; }
  #view { margin: 0 0 24px 24px; }
  aside { padding: 0 24px 24px; align-content: start; overflow: auto; }
}
@media (max-width: 859px) {
  html, body { height: auto; }
  body { grid-template-rows: auto auto auto; }
  #view { height: 58svh; }
}
@media (prefers-reduced-motion: reduce) {
  .ring > i { animation: none; opacity: 0; } .miss { animation: fade 300ms ease forwards; } .fact { transition: none; }
  #moment, #view.moment-on #moment { transform: none; }
  @keyframes fade { from { opacity: .6; } to { opacity: 0; } }
}
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
} }</script>
</head>
<body>
<header>
  <a class="back press" href="second-skin.html" aria-label="Back to your look">←</a>
  <span class="brand lockup"><!-- H10: MoMu's official logo, as assets/brand/momu-logo.svg (inline so it takes currentColor) --><svg class="momu-logo" viewBox="0 0 534 299" role="img" aria-label="MoMu"><title>MoMu</title><g transform="scale(1 2.491667)" fill="currentColor" fill-rule="evenodd"><polygon points="247.449335 0 132.331383 115.359336 12.7377802 0 0 0 0 120 68.4655685 120 68.4655685 56.4509346 133.794221 120 196.889009 120 260.934378 56.4509346 260.934378 120 264 120 264 0"/><polygon points="517.451645 0 402.326108 115.359336 282.738035 0 270 0 270 120 338.464298 120 338.464298 56.4509346 403.794257 120 466.890307 120 530.939597 56.4509346 530.939597 120 534 120 534 0"/></g></svg></span>
  <span class="mono" id="pid"></span>
</header>

<main id="view" aria-label="3D scan of the piece. Drag to turn, pinch to zoom, tap a detail on the piece to find it.">
  <div id="loading" class="mono"><div><svg class="momu-logo load-logo" viewBox="0 0 534 299" aria-hidden="true"><g transform="scale(1 2.491667)" fill="currentColor" fill-rule="evenodd"><polygon points="247.449335 0 132.331383 115.359336 12.7377802 0 0 0 0 120 68.4655685 120 68.4655685 56.4509346 133.794221 120 196.889009 120 260.934378 56.4509346 260.934378 120 264 120 264 0"/><polygon points="517.451645 0 402.326108 115.359336 282.738035 0 270 0 270 120 338.464298 120 338.464298 56.4509346 403.794257 120 466.890307 120 530.939597 56.4509346 530.939597 120 534 120 534 0"/></g></svg><br>Loading MoMu’s 3D scan</div></div>
  <div id="toast" role="status"></div>
  <section id="moment" aria-live="polite" aria-hidden="true">
    <span class="mono" id="m-what"></span>
    <q lang="nl" id="m-quote"></q>
    <p class="en" id="m-en"></p>
    <p class="room" id="m-room"></p>
    <div class="acts"><button class="press" id="m-close" tabindex="-1">Keep looking</button></div>
  </section>
</main>

<aside>
  <div>
    <h1 id="name"></h1>
    <div class="meta"><span class="mono" id="date"></span><span class="mono">MoMu study collection</span></div>
  </div>
  <div class="progress"><span class="mono" id="count"></span><span class="dots" id="dots" aria-hidden="true"></span></div>
  <p class="how" id="how">Turn the scan and look closely. When you spot one of these, tap it on the piece.</p>
  <ol id="details"></ol>
  <button class="cta press" id="wear">Win its fabric</button>
  <a class="more press" id="clo" hidden>See it on a mannequin</a>
  <p class="credit">Quotes from the MoMu record (dcterms:description). English is our translation.</p>
</aside>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { backTo } from "./nav.js";
import { mountScene } from "./scenes.js";   // H6: back gesture closes layers; ← steps back to the Stage instead of stacking a new page

const FOUND_KEY = "secondSkin.found.v1";   // { [pieceId]: [detail index, ...] }; second-skin.html reads it
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const id = new URLSearchParams(location.search).get("id");
const manifest = await (await fetch("pieces.json")).json();
const piece = manifest.pieces.find(p => p.id === id && p.assets.splat);
if (piece) piece.details ??= [];   // a splat entry without details must still open
if (piece?.assets.clo) { const a = document.getElementById("clo"); a.href = `outfit.html?card=${encodeURIComponent(id)}`; a.hidden = false; }   // H14: MoMu's draped CLO model (outfit.html)
if (!piece) { location.replace("second-skin.html"); throw new Error("no splat piece " + id); }

const readFound = () => { try { return JSON.parse(localStorage.getItem(FOUND_KEY) || "{}") || {}; } catch { return {}; } };
const found = new Set([].concat(readFound()[id] || []).filter(i => Number.isInteger(i) && i >= 0 && i < piece.details.length));
const saveFound = () => {   // opening the page counts as having seen the card, so the id is stored even with none found
  try { localStorage.setItem(FOUND_KEY, JSON.stringify({ ...readFound(), [id]: [...found] })); } catch { /* blocked */ }
};
saveFound();

/* ---------- Panel ---------- */
const $ = s => document.querySelector(s);
document.title = `${piece.name} · MoMu`;
$("#pid").textContent = id;
$("#name").textContent = piece.name;
$("#date").textContent = piece.year.from === piece.year.to ? piece.year.from : `${piece.year.from}–${piece.year.to}`;
// quotes are cut from longer record sentences: an ellipsis marks each cut so the quote never reads as complete
const excerpt = q => `${/^[a-z]/.test(q) ? "…" : ""}${q}${/[.!?]$/.test(q) ? "" : "…"}`;
$("#dots").innerHTML = piece.details.map(() => "<i></i>").join("");
$("#details").innerHTML = piece.details.map((d, i) => `
  <li data-i="${i}">
    <div class="row"><span class="mark" aria-hidden="true"></span><span class="find">${d.find}</span>
      <button class="show press" data-show="${i}" tabindex="-1">Hint</button></div>
    <div class="fact"><div><q lang="nl">${excerpt(d.quote)}</q><p><span class="mono">EN</span>${d.en}</p></div></div>
  </li>`).join("");
function renderPanel() {
  const n = found.size, total = piece.details.length;
  $("#count").textContent = n === total ? "All details found" : `${n} of ${total} found`;
  document.querySelectorAll("#dots i").forEach((el, i) => el.classList.toggle("on", i < n));
  document.querySelectorAll("#details li").forEach(li => li.classList.toggle("found", found.has(+li.dataset.i)));
  $("#wear").classList.toggle("on", n === total);
  $("#wear").textContent = n === total ? "Win its fabric" : `Find ${total - n} more on the piece to win its fabric`;
  $("#how").hidden = n === total;
}
renderPanel();
$("header .back").addEventListener("click", e => { e.preventDefault(); backTo("second-skin.html"); });   // H6: a link would stack a new Stage
const claim = () => {   // H6: back to the Stage underneath (it shows the Won card), never a new entry that back would return through
  try { sessionStorage.setItem("secondSkin.claim", id); } catch { /* blocked: ?fabric= below still carries it */ }
  backTo(`second-skin.html?fabric=${encodeURIComponent(id)}`);
};
$("#wear").addEventListener("click", () => {   // never a dead button; H11: before all are found it points at the piece, not at the answer
  const next = piece.details.findIndex((_, i) => !found.has(i));
  if (next < 0) claim();
  else if (!view.classList.contains("ready")) return;
  else if (hintsOpen) showMe(next);
  else toast("Look on the piece and tap what you spot");
});

/* ---------- H11: hints open after a first try (a miss) or a while of looking, so nobody gets stuck (D2) ---------- */
const HINT_AFTER = 20000;
let hintsOpen = false, hintTimer;
function openHints() {
  if (hintsOpen) return;
  hintsOpen = true; $("aside").classList.add("hints");
  document.querySelectorAll("#details .show").forEach(b => b.removeAttribute("tabindex"));
}
const waitForHints = () => { clearTimeout(hintTimer); if (!hintsOpen) hintTimer = setTimeout(openHints, HINT_AFTER); };

/* ---------- Scene ---------- */
const view = $("#view");
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });   // H7: transparent, so the scene shows behind the splat
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
mountScene(view).set(piece.year);   // H7: a period room instead of the grey wall
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: false, minPolarAngle: Math.PI * 0.3, maxPolarAngle: Math.PI * 0.62 });
function resize() {
  const { clientWidth: w, clientHeight: h } = view;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

// A piece with MoMu's own CLO model shows that model on MoMu's mannequin; every other study piece shows its splat scan.
// Both are turned into one frame (front towards -z, y up), so the box, camera and details work the same on either.
const clo = piece.assets.clo;
let mesh, box;
try {
  const timeout = new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 45000));
  if (clo) {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.8;   // as outfit.html: white cloth keeps its folds
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8680, 0.15));
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-1.2, 2.2, -2); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(1.5, 1.5, 2); scene.add(rim);
    const loader = new GLTFLoader();
    const [garment, body] = await Promise.race([Promise.all([clo.path, clo.avatar].map(u => loader.loadAsync(u))), timeout]);
    body.scene.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0xe4ddd2, roughness: 0.85 }); });
    mesh = new THREE.Group(); mesh.add(garment.scene, body.scene);
    mesh.rotation.y = Math.PI;   // CLO garments face +z
    scene.add(mesh); mesh.updateMatrixWorld(true);
    box = new THREE.Box3().setFromObject(garment.scene);   // the garment's box, not the mannequin's: details sit on the cloth
  } else {
    const { SparkRenderer, SplatMesh } = await import("@sparkjsdev/spark");
    scene.add(new SparkRenderer({ renderer }));
    // .sog is what deploys; a local .ply of the same name is the fallback while only the raw capture exists
    let url = piece.assets.splat.path;
    // the HEAD round trip only matters on a dev machine that has the raw .ply but not the .sog; the deployed site always has the .sog
    if (/^(localhost|127\.0\.0\.1|.*\.local)$/.test(location.hostname) && !(await fetch(url, { method: "HEAD" })).ok) url = url.replace(/\.sog$/, ".ply");
    mesh = new SplatMesh({ url });
    mesh.quaternion.set(1, 0, 0, 0);   // the captures are y-down
    scene.add(mesh);
    await Promise.race([mesh.initialized, timeout]);
    box = new THREE.Box3().setFromPoints(corners(mesh.getBoundingBox()).map(p => p.applyQuaternion(mesh.quaternion)));
  }
} catch {   // a 15 MB scan on venue wifi can fail: say so instead of loading forever
  $("#loading").innerHTML = `<div>The ${clo ? "model" : "scan"} didn't load<br><br><a href="" style="text-decoration:underline">Try again</a></div>`;
  await new Promise(() => {});
}

const centre = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
// details[].at is placed on the splat; atClo on the CLO model, whose box and drape differ
const points = piece.details.map(d => new THREE.Vector3(...((clo && d.atClo) || d.at).map((f, k) => box.min.getComponent(k) + f * size.getComponent(k))));
const dist = size.y * 1.55;
controls.target.copy(centre);
controls.minDistance = size.y * 0.55; controls.maxDistance = size.y * 2.6;
camera.position.set(centre.x, centre.y, centre.z - dist);   // the captures face -z
view.classList.add("ready");
waitForHints();

function corners(b) {
  return [0, 1, 2, 3, 4, 5, 6, 7].map(i => new THREE.Vector3(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z));
}

/* ---------- Pins: found details stay marked; a hint rings the area around the asked one, never the spot ---------- */
const pins = points.map(() => {
  const el = document.createElement("div"); el.className = "pin"; el.hidden = true;
  view.append(el); return el;
});
const ring = document.createElement("div"); ring.className = "ring"; ring.hidden = true; ring.innerHTML = "<i></i>";
view.append(ring);
const RING = 60;   // px radius; a tap anywhere inside the ring finds the hinted detail
let hint = -1, ringOff = { x: 0, y: 0 };
function facing(p) {   // a detail on the far side of the dress is hidden, so it can't be found through the cloth
  const n = new THREE.Vector3(p.x - centre.x, 0, p.z - centre.z), v = camera.position.clone().sub(p);
  return n.lengthSq() < 1e-6 || n.normalize().dot(v.setY(0).normalize()) > 0.25;
}
function screenOf(p) {
  const s = p.clone().project(camera);
  return { x: (s.x + 1) / 2 * view.clientWidth, y: (1 - s.y) / 2 * view.clientHeight };
}
function placePins() {
  points.forEach((p, i) => {
    const on = found.has(i) && facing(p);
    pins[i].hidden = !on;
    if (on) { const { x, y } = screenOf(p); pins[i].style.transform = `translate(${x}px, ${y}px)`; }
  });
  const ringOn = hint >= 0 && !turn && facing(points[hint]);
  ring.hidden = !ringOn;
  if (ringOn) { const { x, y } = ringAt(); ring.style.transform = `translate(${x}px, ${y}px)`; }
}
function ringAt() { const s = screenOf(points[hint]); return { x: s.x + ringOff.x, y: s.y + ringOff.y }; }

/* ---------- Tap to find: a tap, not the end of a drag, within reach of an unfound detail facing you ---------- */
const REACH = 44, NEAR = 90;
let down = null, misses = 0;
renderer.domElement.addEventListener("pointerdown", e => {   // a tap that only puts the found card away is not a guess
  down = { x: e.clientX, y: e.clientY, t: performance.now(), dismiss: momentOn }; closeMoment();
});
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || down.dismiss || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 400) return;
  const r = view.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = -1, bestD = REACH, near = Infinity, anyFacing = false;
  points.forEach((p, i) => {
    if (found.has(i) || !facing(p)) return;
    anyFacing = true;
    const s = screenOf(p), d = Math.hypot(s.x - x, s.y - y);
    near = Math.min(near, d);
    if (d < bestD) { best = i; bestD = d; }
  });
  if (best < 0 && hint >= 0 && !found.has(hint) && facing(points[hint])) {   // inside the hint ring counts
    const c = ringAt(); if (Math.hypot(c.x - x, c.y - y) <= RING) best = hint;
  }
  if (best < 0) return miss(x, y, anyFacing, near);
  found.add(best); if (hint === best) hint = -1;
  saveFound(); renderPanel(); waitForHints();
  showMoment(best);
});
// H11: a wrong tap is gentle: a ripple where the finger was, and a line that helps rather than scolds
function miss(x, y, anyFacing, near) {
  const m = document.createElement("div"); m.className = "miss"; m.style.left = x + "px"; m.style.top = y + "px";
  view.append(m); setTimeout(() => m.remove(), 500);
  misses++; openHints();
  if (!anyFacing) toast("Nothing left to find on this side. Turn the piece.");
  else if (near < NEAR) toast("Close. Look a little nearer.");
  else if (misses === 1) toast("Not there. Turn the piece and keep looking.");
  else if (misses % 3 === 0) toast("Stuck? Tap Hint next to a clue.");
}

/* ---------- H11 + J5: the found moment shows the record's words large, then sends the eye to the real piece ---------- */
let momentOn = false;
function showMoment(i) {
  const d = piece.details[i], all = found.size === piece.details.length;
  $("#m-what").textContent = all ? `All ${piece.details.length} found · ${d.find}` : `Found · ${d.find}`;
  $("#m-quote").textContent = excerpt(d.quote);
  $("#m-en").textContent = d.en;
  $("#m-room").textContent = "Now find it on the real piece in front of you.";
  const b = $("#m-close");
  b.textContent = all ? "Win its fabric" : "Keep looking"; b.classList.toggle("go", all);
  b.removeAttribute("tabindex");
  $("#moment").setAttribute("aria-hidden", "false");
  view.classList.add("moment-on"); momentOn = true;
  toast.clear?.();
}
function closeMoment() {
  if (!momentOn) return;
  momentOn = false; view.classList.remove("moment-on");
  $("#moment").setAttribute("aria-hidden", "true"); $("#m-close").setAttribute("tabindex", "-1");
}
$("#m-close").addEventListener("click", () => { if (found.size === piece.details.length) claim(); else closeMoment(); });

let toastTimer;
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}
toast.clear = () => { clearTimeout(toastTimer); $("#toast").classList.remove("on"); };

/* ---------- Hint: turn to face the detail and ring the area around it; the visitor still taps it on the piece ---------- */
let turn = null;
$("#details").addEventListener("click", e => {
  const b = e.target.closest("[data-show]"); if (b && hintsOpen && view.classList.contains("ready")) showMe(+b.dataset.show);
});
function showMe(i) {
  closeMoment();
  hint = i;
  const a = Math.random() * Math.PI * 2, k = RING * (0.25 + Math.random() * 0.3);   // off-centre, so the ring is not a bullseye
  ringOff = { x: Math.cos(a) * k, y: Math.sin(a) * k };
  toast("Somewhere in the ring. Tap it on the piece.");
  const p = points[hint], dir = new THREE.Vector3(p.x - centre.x, 0, p.z - centre.z);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  const r = camera.position.distanceTo(centre);
  const to = centre.clone().add(dir.normalize().multiplyScalar(Math.sqrt(r * r - (camera.position.y - centre.y) ** 2)));
  to.y = camera.position.y;
  if (reduce) camera.position.copy(to);
  else turn = { from: camera.position.clone(), to, t0: performance.now() };
}
function stepTurn(now) {
  if (!turn) return;
  const k = Math.min(1, (now - turn.t0) / 700), e = 1 - Math.pow(1 - k, 3);
  const a = turn.from.clone().sub(centre), b = turn.to.clone().sub(centre);
  const ang = Math.atan2(a.x, a.z) + angleDiff(Math.atan2(a.x, a.z), Math.atan2(b.x, b.z)) * e;
  const rr = Math.hypot(a.x, a.z);
  camera.position.set(centre.x + Math.sin(ang) * rr, turn.from.y, centre.z + Math.cos(ang) * rr);
  if (k === 1) turn = null;
}
const angleDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
controls.addEventListener("start", () => { turn = null; });

// fracAt(clientX, clientY, fz): the `details[].at` value for a screen point, at depth fz of the box (front is low)
function fracAt(sx, sy, fz) {
  const r = view.getBoundingClientRect();
  const dir = new THREE.Vector3((sx - r.left) / r.width * 2 - 1, -(sy - r.top) / r.height * 2 + 1, 0.5)
    .unproject(camera).sub(camera.position).normalize();
  const p = camera.position.clone().addScaledVector(dir, (box.min.z + fz * size.z - camera.position.z) / dir.z);
  return [(p.x - box.min.x) / size.x, (p.y - box.min.y) / size.y, fz].map(v => +v.toFixed(3));
}
window.upClose = { piece, points, camera, controls, found, box, mesh, fracAt };
renderer.setAnimationLoop(now => { stepTurn(now); controls.update(); placePins(); renderer.render(scene, camera); });
// Leaving for the Stage: release the scan and the GPU now instead of keeping 15 MB of splats alive in the back-forward
// cache; if the browser shows this page again from that cache, it starts over (the scan comes from the HTTP cache)
addEventListener("pagehide", () => {
  renderer.setAnimationLoop(null);
  scene.remove(mesh); mesh.dispose?.(); mesh.traverse?.(o => { o.geometry?.dispose(); [].concat(o.material ?? []).forEach(m => m.dispose()); }); controls.dispose();
  renderer.dispose(); renderer.forceContextLoss();
  delete window.upClose;
});
addEventListener("pageshow", e => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
