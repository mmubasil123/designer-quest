<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cycling outfit · MoMu</title>
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: var(--t-body); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--ink); border-radius: 999px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
/* the same header as Up close (H10): back arrow, MoMu's logo, the piece id */
header { display: flex; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: inherit; text-decoration: none; flex: none; }
.press { transition: transform 160ms var(--ease-out); }
.press:active { transform: scale(0.97); }
header .mono { margin-left: auto; }
h1 { font: var(--t-display); letter-spacing: var(--track-title); text-transform: uppercase; color: var(--title-ink); font-size: 22px; text-wrap: balance; }
#view { margin: 0 16px; background: var(--wall); border-radius: var(--r-pic); overflow: hidden; position: relative; touch-action: none; }
#view canvas { display: block; width: 100%; height: 100%; }
#status { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }
#status:empty { display: none; }
footer { padding: 12px 16px max(16px, env(safe-area-inset-bottom)); display: grid; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.credit { color: var(--muted); font-size: 12px; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }</script>
</head>
<body>
<header>
  <a class="back press" id="back" href="second-skin.html" aria-label="Back to your look">←</a>
  <span class="brand lockup"><!-- H10: MoMu's official logo, as assets/brand/momu-logo.svg (inline so it takes currentColor) --><svg class="momu-logo" viewBox="0 0 534 299" role="img" aria-label="MoMu"><title>MoMu</title><g transform="scale(1 2.491667)" fill="currentColor" fill-rule="evenodd"><polygon points="247.449335 0 132.331383 115.359336 12.7377802 0 0 0 0 120 68.4655685 120 68.4655685 56.4509346 133.794221 120 196.889009 120 260.934378 56.4509346 260.934378 120 264 120 264 0"/><polygon points="517.451645 0 402.326108 115.359336 282.738035 0 270 0 270 120 338.464298 120 338.464298 56.4509346 403.794257 120 466.890307 120 530.939597 56.4509346 530.939597 120 534 120 534 0"/></g></svg></span>
  <span class="mono" id="pid"></span>
</header>
<div id="view"><div id="status" role="status">Loading</div></div>
<footer>
  <h1 id="title">Cycling outfit</h1>
  <div class="row" id="pieces" aria-label="Wear"></div>
  <div class="row" id="views" aria-label="View"><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="back">Back</button></div>
  <p class="credit" id="credit"></p>
</footer>
<script type="module">
/* CLO garments on the body they were draped on, through OutfitRig. A piece with `assets.clo` in pieces.json names its
   body (`assets.clo.avatar`): the team's pieces share the team avatar, a MoMu CLO project comes with MoMu's mannequin in the
   pose it was draped in. The page shows one body and the pieces draped on it (D5: nothing is fitted or rescaled).
   ?card=<id> picks that piece's body and starts with it on. Console handle: window.outfit = { rig, view(name) }. */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { OutfitRig } from "./clo/outfit.js";
import { backTo } from "./nav.js";   // H6: step back to the Stage instead of stacking a new one

const $ = s => document.querySelector(s), view = $("#view"), status = $("#status");
const manifest = await (await fetch("pieces.json")).json();
const card = new URLSearchParams(location.search).get("card");
const all = manifest.pieces.filter(p => p.assets.clo);
const avatarUrl = (all.find(p => p.id === card) ?? all.find(p => /avatar_web\.glb$/.test(p.assets.clo.avatar)) ?? all[0]).assets.clo.avatar;   // no card: the team avatar's outfit
const clo = all.filter(p => p.assets.clo.avatar === avatarUrl);   // the pieces draped on this body
const team = /avatar_web\.glb$/.test(avatarUrl);
const word = clo[0].name.split(" ")[0];
$("#title").textContent = clo.length > 1 && clo.every(p => p.name.startsWith(word)) ? `${word} outfit` : clo[0].name;
$("#pid").textContent = clo.map(p => p.id).join(" · ");
document.title = `${$("#title").textContent} · MoMu`;
$("#credit").textContent = team ? "Models by the team, sewn in CLO 3D and draped on the team avatar. Worn as exported: nothing is fitted."
  : "MoMu's own CLO 3D model, on MoMu's mannequin in the pose it was draped in. Worn as exported: nothing is fitted.";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--wall").trim());
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
// soft studio light, as in CLO's viewport: filmic tone mapping keeps the white voile from burning out, a low fill
// keeps folds readable on the black denim
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.8; scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8680, 0.15));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-1.2, 2.2, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(1.5, 1.5, -2); scene.add(rim);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.enableDamping = true;
controls.minDistance = 1.5; controls.maxDistance = 6;
controls.target.set(0, 0.9, 0);

const rig = new OutfitRig({ loader: new GLTFLoader(), cacheSize: 4 });
scene.add(rig.root);
const slotOf = p => ["top", "bottom", "full", "outer"].includes(p.wear ?? p.slot) ? (p.wear ?? p.slot) : "full";   // a study piece wears where `wear` says
for (const p of clo) rig.register({ id: p.id, slot: slotOf(p), glb: p.assets.clo.path, label: p.name,
  variants: (p.assets.clo.variants || []).map(v => ({ over: v.over, glb: v.path })) });

const FORM = 0xe4ddd2;
const av = await rig.setAvatar(avatarUrl);
av.traverse(o => { if (!o.isMesh) return; o.material = new THREE.MeshStandardMaterial({ color: FORM, roughness: 0.85 }); o.frustumCulled = false; });

// a static body (MoMu's mannequin, arms out) is framed by its own box; the skinned team avatar's box is its bind pose, so it keeps a fixed frame
let skinned = false; av.traverse(o => { skinned ||= !!o.isSkinnedMesh; });
const box = skinned ? null : new THREE.Box3().setFromObject(av);
const views = { front: 0, side: Math.PI / 2, back: Math.PI };   // garments face +z
function setView(name) {
  const a = views[name]; let d = 3.4, y = 0.9;
  if (box) {
    const s = box.getSize(new THREE.Vector3()), t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), w = name === "side" ? s.z : s.x;
    d = 1.08 * Math.max(s.y / (2 * t), w / (2 * t * camera.aspect)) + s.z / 2; y = (box.min.y + box.max.y) / 2;
    controls.maxDistance = Math.max(6, d * 1.2);
  }
  controls.target.set(0, y, 0);
  camera.position.set(Math.sin(a) * d, y + 0.2, Math.cos(a) * d); controls.update();
}
function size() {
  const { clientWidth: w, clientHeight: h } = view; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(size).observe(view); size(); setView("front");
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

const btns = $("#pieces");
for (const p of clo) {
  const b = document.createElement("button");
  b.dataset.id = p.id; b.setAttribute("aria-pressed", "false"); b.textContent = p.name;
  btns.append(b);
}
btns.addEventListener("click", async e => {
  const id = e.target.closest("button")?.dataset.id; if (!id) return;
  try { await rig.toggle(id); } catch (err) { console.error(err); status.textContent = "A piece did not load"; }
});
rig.addEventListener("change", e => {
  for (const b of btns.children) b.setAttribute("aria-pressed", String(e.detail.worn.includes(b.dataset.id)));
});
$("#back").addEventListener("click", e => { e.preventDefault(); backTo("second-skin.html"); });
$("#views").addEventListener("click", e => { const v = e.target.closest("button")?.dataset.v; if (v) setView(v); });
status.textContent = "";
if (card && rig.items.has(card)) await rig.wear(card);
window.outfit = { rig, view: setView, camera, controls, renderer, scene };
</script>
</body>
</html>
