<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splat Stage spike</title>
<style>
:root { --wall: #e6e1d6; --ink: #1d1b18; --line: #b9b2a4; }
html, body { margin: 0; height: 100%; background: var(--wall); color: var(--ink); font: 15px/1.3 system-ui, sans-serif; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; display: grid; gap: 8px;
  background: linear-gradient(transparent, var(--wall) 30%); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row b { width: 58px; font-weight: 600; }
button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px; background: #f6f3ec;
  color: var(--ink); font: inherit; }
button[aria-pressed="true"] { background: var(--ink); color: #f6f3ec; border-color: var(--ink); }
#status { position: fixed; top: 12px; left: 16px; font: 12px ui-monospace, monospace; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
} }</script>
</head>
<body>
<main id="view" aria-label="Splat dress form. Drag to turn."></main>
<div id="status">Loading parts</div>
<div id="ui">
  <div class="row" data-group="top"><b>Top</b>
    <button data-v="ST2431_top">Cavalry jacket</button><button data-v="ST2432_top">Tailcoat</button><button data-v="">None</button></div>
  <div class="row" data-group="bottom"><b>Bottom</b>
    <button data-v="ST2431_bottom">Red trousers</button><button data-v="ST2432_bottom">Dark trousers</button><button data-v="">None</button></div>
  <div class="row" data-group="fabric"><b>Fabric</b>
    <button data-v="">Original</button><button data-v="#3b4f8c">Indigo</button><button data-v="#c08a2e">Ochre</button><button data-v="#9b2d2a">Madder</button></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh, dyno } from "@sparkjsdev/spark";
const { dynoBlock, Gsplat, splitGsplat, combineGsplat, dynoVec3, dynoFloat, dynoConst, dot, mul, div, sub, clamp, mix } = dyno;

// parts come from mockups/tools/splat_spike_cut.py; ST2432 sat 4 mm left and 15 mm back of ST2431 on the same form
const PARTS = { avatar: [0, 0, 0], ST2431_top: [0, 0, 0], ST2431_hands: [0, 0, 0], ST2431_bottom: [0, 0, 0],
  ST2432_top: [-0.0044, 0, 0.0147], ST2432_hands: [-0.0044, 0, 0.0147], ST2432_bottom: [-0.0044, 0, 0.0147] };
const state = { top: "ST2431_top", bottom: "ST2432_bottom", fabric: "" };

const view = document.querySelector("#view");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
view.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--wall").trim());
scene.add(new SparkRenderer({ renderer }));
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: false, minPolarAngle: Math.PI * 0.3, maxPolarAngle: Math.PI * 0.62 });
controls.target.set(0, -0.06, 0);
camera.position.set(0, -0.02, -2.1);   // the captures face -z once flipped upright
new ResizeObserver(() => {
  renderer.setSize(view.clientWidth, view.clientHeight, false);
  camera.aspect = view.clientWidth / view.clientHeight; camera.updateProjectionMatrix();
}).observe(view);

// keep each splat's luminance (folds, braid), take the fabric's hue; 0.16 is about the mean garment luminance
const tint = dynoVec3(new THREE.Vector3(1, 1, 1)), amount = dynoFloat(0);
const remix = dynoBlock({ gsplat: Gsplat }, { gsplat: Gsplat }, ({ gsplat }) => {
  const { rgb } = splitGsplat(gsplat).outputs;
  const lum = dot(rgb, dynoConst("vec3", [0.299, 0.587, 0.114]));
  const dyed = mul(tint, clamp(div(lum, dynoConst("float", 0.16)), dynoConst("float", 0), dynoConst("float", 2.2)));
  // the cream form seen through an open coat (lum above about 0.45) stays undyed
  const cloth = clamp(mul(sub(dynoConst("float", 0.5), lum), dynoConst("float", 12)), dynoConst("float", 0), dynoConst("float", 1));
  return { gsplat: combineGsplat({ gsplat, rgb: mix(rgb, dyed, mul(amount, cloth)) }) };
});

const meshes = {};
const t0 = performance.now();
await Promise.all(Object.entries(PARTS).map(async ([name, [x, y, z]]) => {
  const m = new SplatMesh({ url: `assets/splat/spike/${name}.sog` });
  m.quaternion.set(1, 0, 0, 0);   // the captures are y-down
  m.position.set(x, y, z);
  if (name.endsWith("_top")) { m.objectModifier = remix; }
  scene.add(m); meshes[name] = m;
  await m.initialized;
  if (m.objectModifier) m.updateGenerator();
}));
const loadMs = Math.round(performance.now() - t0);

function apply() {
  // Spark still draws a SplatMesh with visible = false, so worn parts are added and the rest removed
  for (const [name, m] of Object.entries(meshes)) {
    const worn = [state.top, state.top.replace("_top", "_hands"), state.bottom];   // arms were posed per capture
    if (name === "avatar" || worn.includes(name)) scene.add(m); else scene.remove(m);
  }
  if (state.fabric) { const c = new THREE.Color(state.fabric); tint.value.set(c.r, c.g, c.b); amount.value = 1; }
  else amount.value = 0;
  meshes[state.top]?.updateVersion();   // modifier uniforms only reach the splats when the mesh regenerates
  document.querySelectorAll("[data-group]").forEach(row => row.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.v === state[row.dataset.group]))));
  document.querySelector("#status").textContent = `${loadMs} ms · ${state.top || "no top"} + ${state.bottom || "no bottom"}`;
}
document.querySelector("#ui").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state[b.closest("[data-group]").dataset.group] = b.dataset.v; apply();
});
apply();
window.spike = { state, apply, meshes, camera, controls, tint, amount };
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
